<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>Image Editor</title>
		
		<style>
		#PageWrapper {
			position: absolute;
			width: 100%;
			height: 100%;
		}

		/* Button Panel */
		.buttonPanel {
			background-color: #FaFaFa;
			border: none;
			border-bottom: 1px solid #BBBDC0;
			padding: 0px;
			position: absolute;
			width: 100%;
			top: 0px;
			height: 43px;
		}

		.buttonPanelContent {
			overflow-y: hidden;
		}

		.ui-button.IconButton {
			border-radius: 0px;
			font-size: 20px;
			margin-left: 0px;
			background-color: transparent;
		}

		.ui-button.IconButton:hover {
			color: #6A8CFF;
		}

		.ui-button.IconButton:not(.ui-state-focus) {
			border: none;
		}

		.buttonPanelLeft {
			font-size: 14px;
			width: 33%;
			text-align: left;
			white-space: nowrap;
			padding-left: 10px;
		}

		.buttonPanelCenter {
			width: 33%;
			text-align: center;
			font-size: 14px;
			white-space: nowrap;
		}

		.buttonPanelRight {
			text-align: right;
			width: 33%;
			font-size: 14px;
			white-space: nowrap;
		}
		.MediaWrapper {
			position: relative;
			top: 44px;
			height: calc(100% - 44px);
			width: 100%;
			background
		}

		.MediaDiv {
			width: calc(100% - 401px);
			height: 100%;
			position: absolute;
			left: 200px;
			border-left: 1px solid #BBBDC0;
			border-right: 1px solid #BBBDC0;
			background-color: #888;
			text-align: center;
			padding: 0px;
			overflow:auto;
		}

		.ToolsDiv {
			height: 100%;
			border: none;
			background-color: #eaeaea;
			position: absolute;
			left: 0px;
			width: 200px;
		}

		.SettingsDiv {
			height: 100%;
			border: none;
			background-color: #eaeaea;
			position: absolute;
			right: 0px;
			width: 200px;
		}

		.propertyHeaderText {
			display: block;
			padding: 5px 5px 5px 15px;
			border-bottom: 1px solid #BBBDC0;
		}

		.propertyHeader {
			font-size: 18px;
			white-space: nowrap;
			min-height: 24px;
		}

		.propertyContent {
			padding: 5px;
		}
		.editor {
			background-color: #444;
			position: absolute;
			display: inline-block;
			left: 0px;
			top: 0px;
		}

		#event_editor {
			background: transparent;
		}

		.Tool {
			display: inline-block;
			width: 50px;
			height: 50px;
			border: 1px solid #BBBDC0;
			font-size: 14px;
			vertical-align: middle;
			text-align: center;
			padding: 5px;
			cursor: pointer;
		}
		.Tool:before {
			content : ' ';
			display: inline-block;
			height: 100%;
			vertical-align: middle;
		}

		.Tool.selected {
			background: #AEAEFF;
		}

		.settingGroup {
			display: none; 
		}

		.settingGroup.visible {
			display: block;
		}
		
		</style>
		
		<script>
			function addClass(element, clazz) {
				element.classList.add(clazz);
			}
			function removeClass(element, clazz) {
				element.classList.remove(clazz);
			}
			
			function getElement(id) {
				return document.getElementById(id);
			}
			
			function getElements(clazz, parent) {
				parent = parent || document;
				return parent.getElementsByClassName(clazz)
			}
		</script>
	</head>
	<body>
		<form>
			<input id="imageData" name="imageData" type="hidden" />
		</form>
	

		<div id="PageWrapper">
			<div class="MediaWrapper">
				<div class="ToolsDiv">
					<div class="propertyHeader">
						<div class="ExpandedContent propertyHeaderText">
							Tools
						</div>
					</div>
					<div id="toolContainer" class="propertyContent">
						<div class="Tool selected" onclick="setPaintTool('pen',this);" title="Pen">
							Pen
						</div>
						<div class="Tool" onclick="setPaintTool('move',this)" title="Move">
							Move
						</div>
						<div class="Tool" onclick="setPaintTool('line',this);" title="Line">
							Line
						</div>
						<div class="Tool" style="width: 75px;" onclick="setPaintTool('rectangle',this);" title="Rectangle">
							Rectangle
						</div>
					</div>
				</div>

				<div class="SettingsDiv">
					<div class="propertyHeader">
						<div class="ExpandedContent propertyHeaderText">
							Settings
						</div>
					</div>
					<div id="settingsContainer" class="propertyContent">
						<div id="moveSettings" class="settingGroup">
							<i>No Settings For Move</i>
						</div>
						<div id="penSettings" class="settingGroup">
							<div>
								<label> Width </label>
								<input type="number" min="1" max="50" value="5" onchange="updateToolSetting('pen', 'width', this.value);" />

								<label> Color</label>
								<input type="color" value="#000000" onchange="updateToolSetting('pen', 'color', this.value);" />

								<label> Opacity </label>
								<input type="number" min="1" max="100" value="100" onchange="updateToolSetting('pen', 'opacity', this.value);" />
							</div>
						</div>
						<div id="lineSettings" class="settingGroup">
							<div>
								<label>Width" </label>
								<input type="number" min="1" max="50" value="5" onchange="updateToolSetting('line', 'width', this.value);" />

								<label>Color" </label>
								<input type="color" value="#000000" onchange="updateToolSetting('line', 'color', this.value);" />

								<label>Opacity" </label>
								<input type="number" min="1" max="100" value="100" onchange="updateToolSetting('line', 'opacity', this.value);"  />
							</div>
						</div>
					</div>
				</div>

				<div class="MediaDiv">
					<canvas class="editor" id="editor" />
				</div>

			</div>
		</div>

		<script src="ImageEditor.js" ></script>
		<script src="Shapes.js" /></script>
		<script src="Tools.js" /></script>
		<script>
			var config = {
				canvas : getElement('editor'),
				image : getElement('Image')
			}

			paint = new Paint(config);
			function setPaintTool(toolName, caller) {
				paint.setTool(toolName);
				
				var settingsContainer = getElement('settingsContainer');
				var toolContainer= getElement('toolContainer');
				if (caller) {
					let selected = getElements('selected',toolContainer)[0];
					removeClass(selected,'selected');
					//$('.selected').removeClass('selected');
					addClass(caller,'selected');
					//$(caller).addClass('selected');
				}

				let visibleSettings = getElements('visible',settingsContainer)[0];
				if (visibleSettings) {
					removeClass(visibleSettings,'visible');
				}
				//$('.settingGroup.visible').removeClass('visible');
				
				addClass(getElement(toolName+"Settings"),'visible');
				//var selector = '#' + toolName + "Settings";
				//$(selector).addClass('visible');
			}
			setPaintTool('pen');

			function updateToolSetting(toolName, settingName, value) {
				paint.updateTool(toolName, settingName, value);
			}
			var mimeType = "#{goDriveMediaForm.currentFile.mediaType.contentType}";
			function download() {
				var image = getImage().replace(mimeType, "image/octet-stream");
				var link = document.createElement('a');
				link.setAttribute('download',
						'#{goDriveMediaForm.currentFile.name}');
				link.setAttribute('href', image);
				link.click();
			}

			function getImage() {
				return paint.getImage(mimeType);
			}

			function save() {
				var input = getElement('imageData');
				input.value = getImage();
			}
		</script>
</body>
	</html>
